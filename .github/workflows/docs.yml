name: docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'skills/fez/**'
      - 'mkdocs.yml'
      - 'requirements.txt'
      - '.github/workflows/docs.yml'

permissions:
  contents: write

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # v7.0.0
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup Python
        # v5.7.0
        uses: actions/setup-python@a8071901898cc51043022d384bc9267e9dd029ef
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build docs
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        # v4.0.0
        # yamllint disable-line rule:line-length
        uses: peaceiris/actions-gh-pages@981c28237bcdd3bd01a658beb30595a85c6805af
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
