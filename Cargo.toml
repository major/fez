[package]
name = "rusty-fez"
version = "0.2.0"
edition = "2021"
rust-version = "1.92"
license = "Apache-2.0"
description = "Agent-native management CLI for Fedora/RHEL (drives cockpit-bridge)"
repository = "https://github.com/major/fez"
homepage = "https://github.com/major/fez"
readme = "README.md"
keywords = ["cockpit", "systemd", "fedora", "agent", "cli"]
categories = ["command-line-utilities"]
default-run = "fez"

[lib]
name = "fez"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
clap_mangen = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[[bin]]
name = "fez"
path = "src/main.rs"

[[bin]]
name = "fez-fake-bridge"
path = "src/bin/fake_bridge.rs"
