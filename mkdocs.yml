site_name: fez
site_description: Agent-native management CLI for Fedora/RHEL
repo_url: https://github.com/major/fez
exclude_docs: |
  agents/
  superpowers/
theme:
  name: material
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - search.highlight
    - search.suggest
strict: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Agent Guide:
      - Overview: agent-guide/index.md
      - Discovery & Describe: agent-guide/discovery.md
      - JSON Envelope: agent-guide/json-envelope.md
      - Security Model: agent-guide/security-model.md
      - Safety & Guardrails: agent-guide/safety.md
      - Remote Hosts: agent-guide/remote-hosts.md
      - Workflows: agent-guide/workflows.md
  - Capability Reference:
      - Overview: reference/index.md
      - Services: reference/services.md
      - Packages: reference/packages.md
      - Network: reference/network.md
      - Firewall: reference/firewall.md
      - System: reference/system.md
      - Storage: reference/storage.md
      - DNS: reference/dns.md
      - Journal: reference/journal.md
